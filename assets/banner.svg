<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hoang Duy Linh — Data Science Engineer, AI and Backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f9ff"/>
      <stop offset="100%" stop-color="#eef6f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f9f95"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="140" cy="40" r="280" fill="url(#blob1)"/>
  <circle cx="1180" cy="300" r="300" fill="url(#blob2)"/>
  <circle cx="420" cy="330" r="240" fill="url(#blob3)"/>

  <circle cx="1082" cy="158" r="112" fill="none" stroke="#4f46e5" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="1082" cy="158" r="92" fill="url(#mono)"/>
  <text x="1082" y="158" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="800" fill="#ffffff" letter-spacing="1">HL</text>
  <circle cx="1152" cy="96" r="12" fill="#14b8a6"/>
  <circle cx="1016" cy="228" r="7" fill="#6366f1" fill-opacity="0.7"/>

  <text x="80" y="72" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#4f46e5" letter-spacing="4">DATA SCIENCE · AI ENGINEERING · BACKEND</text>

  <text x="78" y="158" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Hoang Duy Linh</text>

  <rect x="80" y="182" width="132" height="7" rx="3.5" fill="url(#accent)"/>

  <text x="80" y="232" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#475569">Engineer Degree in Data Science · Hanoi University of Mining and Geology</text>

  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="80" y="256" width="184" height="38" rx="19" fill="#ffffff" stroke="#dbe3f0"/>
    <text x="172" y="275" text-anchor="middle" dominant-baseline="central" fill="#334155">Hanoi, Vietnam</text>

    <rect x="278" y="256" width="236" height="38" rx="19" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="396" y="275" text-anchor="middle" dominant-baseline="central" fill="#4338ca">Open to opportunities</text>

    <rect x="528" y="256" width="160" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="608" y="275" text-anchor="middle" dominant-baseline="central" fill="#0f766e">TOEIC 805/990</text>
  </g>
</svg>
